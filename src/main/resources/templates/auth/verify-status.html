<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verification Status - Student Management System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<div class="auth-wrapper">
    <div class="auth-card">
        <div class="auth-header">
            <div class="d-inline-flex p-3 rounded-circle bg-white bg-opacity-10 mb-3">
                <i class="bi bi-shield-exclamation fs-1 text-danger"></i>
            </div>
            <h4 class="fw-bold mb-1">Account Verification</h4>
            <p class="text-white-50 mb-0 small">Verification token status</p>
        </div>

        <div class="auth-body text-center">
            <div th:if="${error}" class="alert alert-danger d-flex align-items-center gap-2 mb-4 text-start" role="alert">
                <i class="bi bi-exclamation-octagon-fill fs-5"></i>
                <div th:text="${error}">Verification link invalid or expired.</div>
            </div>

            <p class="text-secondary small mb-4">
                If your link has expired, you can request a fresh verification link sent to your registered email address.
            </p>

            <div class="d-grid gap-2">
                <a th:href="@{/resend-verification}" class="btn btn-primary py-2 fw-semibold shadow-sm">
                    <i class="bi bi-arrow-repeat me-1"></i> Resend Verification Link
                </a>
                <a th:href="@{/login}" class="btn btn-outline-secondary py-2 fw-semibold">
                    <i class="bi bi-box-arrow-in-right me-1"></i> Return to Login
                </a>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
