<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Set New Password - Student Management System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<div class="auth-wrapper">
    <div class="auth-card">
        <div class="auth-header">
            <div class="d-inline-flex p-3 rounded-circle bg-white bg-opacity-10 mb-3">
                <i class="bi bi-key-fill fs-1 text-info"></i>
            </div>
            <h4 class="fw-bold mb-1">Set New Password</h4>
            <p class="text-white-50 mb-0 small">Create a strong new password for your account</p>
        </div>

        <div class="auth-body">
            <div th:if="${errorMessage}" class="alert alert-danger d-flex align-items-center gap-2 mb-3" role="alert">
                <i class="bi bi-exclamation-triangle-fill"></i>
                <div th:text="${errorMessage}">Error message</div>
            </div>

            <form th:if="${resetRequest != null && resetRequest.token != null}" th:action="@{/reset-password}" th:object="${resetRequest}" method="post">
                <input type="hidden" th:field="*{token}">

                <div class="mb-3">
                    <label for="newPassword" class="form-label fw-semibold small text-secondary">New Password</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light text-muted"><i class="bi bi-lock"></i></span>
                        <input type="password" id="newPassword" th:field="*{newPassword}" class="form-control" placeholder="••••••••" required autofocus minlength="6">
                    </div>
                </div>

                <div class="mb-3">
                    <label for="confirmPassword" class="form-label fw-semibold small text-secondary">Confirm New Password</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light text-muted"><i class="bi bi-lock-fill"></i></span>
                        <input type="password" id="confirmPassword" th:field="*{confirmPassword}" class="form-control" placeholder="••••••••" required minlength="6">
                    </div>
                </div>

                <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold mb-3 shadow-sm">
                    <i class="bi bi-check2-circle me-1"></i> Update Password
                </button>
            </form>

            <div th:if="${resetRequest == null || resetRequest.token == null}" class="text-center py-3">
                <p class="text-danger mb-3">Invalid or missing password reset token.</p>
                <a th:href="@{/forgot-password}" class="btn btn-outline-primary btn-sm">Request a New Link</a>
            </div>

            <div class="text-center mt-3">
                <a th:href="@{/login}" class="text-decoration-none text-muted small">
                    <i class="bi bi-arrow-left me-1"></i> Back to Login
                </a>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
