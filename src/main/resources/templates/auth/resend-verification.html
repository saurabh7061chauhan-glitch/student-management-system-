<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resend Verification - Student Management System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<div class="auth-wrapper">
    <div class="auth-card">
        <div class="auth-header">
            <div class="d-inline-flex p-3 rounded-circle bg-white bg-opacity-10 mb-3">
                <i class="bi bi-envelope-arrow-up-fill fs-1 text-primary"></i>
            </div>
            <h4 class="fw-bold mb-1">Resend Verification</h4>
            <p class="text-white-50 mb-0 small">Get a new account activation link</p>
        </div>

        <div class="auth-body">
            <div th:if="${successMessage}" class="alert alert-success d-flex align-items-center gap-2 mb-3" role="alert">
                <i class="bi bi-check-circle-fill"></i>
                <div th:text="${successMessage}">Success message</div>
            </div>

            <form th:action="@{/resend-verification}" method="post">
                <div class="mb-3">
                    <label for="identifier" class="form-label fw-semibold small text-secondary">Username or Registered Email</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light text-muted"><i class="bi bi-envelope"></i></span>
                        <input type="text" id="identifier" name="identifier" class="form-control" placeholder="e.g. emma.davis@student.edu" required autofocus>
                    </div>
                    <div class="form-text text-muted small">We'll dispatch a secure activation link valid for 24 hours.</div>
                </div>

                <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold mb-3 shadow-sm">
                    <i class="bi bi-send-check-fill me-1"></i> Resend Verification Email
                </button>
            </form>

            <div class="text-center mt-3">
                <a th:href="@{/login}" class="text-decoration-none text-muted small">
                    <i class="bi bi-arrow-left me-1"></i> Back to Login
                </a>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
