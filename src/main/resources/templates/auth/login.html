<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal Login - Student & Faculty Management System</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <style>
        .role-pill-btn {
            border-radius: 10px;
            font-size: 0.82rem;
            font-weight: 600;
            padding: 8px 12px;
            transition: all 0.2s ease-in-out;
            cursor: pointer;
            border: 1px solid var(--border-color);
            background: #ffffff;
            color: var(--text-secondary);
        }
        .role-pill-btn:hover {
            background: #f1f5f9;
            color: var(--primary);
        }
        .role-pill-btn.active {
            background: var(--primary);
            color: #ffffff;
            border-color: var(--primary);
            box-shadow: 0 4px 10px rgba(79, 70, 229, 0.25);
        }
    </style>
</head>
<body>

<div class="auth-wrapper">
    <div class="auth-card" style="max-width: 460px;">
        <div class="auth-header text-center">
            <div class="d-inline-flex p-3 rounded-circle bg-white bg-opacity-10 mb-2">
                <i id="portalHeaderIcon" class="bi bi-mortarboard-fill fs-2 text-white"></i>
            </div>
            <h4 class="fw-bold mb-1" id="portalTitle">University Portal Login</h4>
            <p class="text-white-50 mb-0 small" id="portalSubtitle">Select your role and sign in with your credentials</p>
        </div>

        <div class="auth-body">
            <!-- Role Selector Nav Tabs -->
            <div class="d-flex gap-2 justify-content-center mb-3 p-1 bg-light rounded-3 border">
                <button type="button" class="btn role-pill-btn flex-fill active" id="tabFaculty" onclick="selectRole('faculty')">
                    <i class="bi bi-person-video3 me-1"></i> Faculty
                </button>
                <button type="button" class="btn role-pill-btn flex-fill" id="tabStudent" onclick="selectRole('student')">
                    <i class="bi bi-mortarboard me-1"></i> Student
                </button>
                <button type="button" class="btn role-pill-btn flex-fill" id="tabAdmin" onclick="selectRole('admin')">
                    <i class="bi bi-shield-lock me-1"></i> Admin
                </button>
            </div>

            <!-- Success Message -->
            <div th:if="${successMessage}" class="alert alert-success d-flex align-items-center gap-2 mb-3" role="alert">
                <i class="bi bi-check-circle-fill"></i>
                <div th:text="${successMessage}">Success message</div>
            </div>

            <!-- Error Message -->
            <div th:if="${errorMessage}" class="alert alert-danger d-flex align-items-start gap-2 mb-3" role="alert">
                <i class="bi bi-exclamation-triangle-fill mt-1"></i>
                <div>
                    <span th:text="${errorMessage}">Error message</span>
                    <div th:if="${showResendLink}" class="mt-1">
                        <a th:href="@{/resend-verification}" class="alert-link text-decoration-underline small">Resend verification email</a>
                    </div>
                </div>
            </div>

            <!-- Info Message -->
            <div th:if="${infoMessage}" class="alert alert-info d-flex align-items-center gap-2 mb-3" role="alert">
                <i class="bi bi-info-circle-fill"></i>
                <div th:text="${infoMessage}">Info message</div>
            </div>

            <form th:action="@{/login}" method="post">
                <div class="mb-3">
                    <label for="username" id="usernameLabel" class="form-label fw-semibold small text-secondary">Faculty ID or Email</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light text-muted"><i id="usernameIcon" class="bi bi-person-badge"></i></span>
                        <input type="text" id="username" name="username" class="form-control" placeholder="e.g. TCH101 or david.miller@college.edu" required autofocus>
                    </div>
                    <div class="form-text small" id="usernameHelp">Enter your assigned Faculty ID or official college email.</div>
                </div>

                <div class="mb-3">
                    <div class="d-flex justify-content-between align-items-center mb-1">
                        <label for="password" class="form-label fw-semibold small text-secondary mb-0">Password</label>
                        <a th:href="@{/forgot-password}" class="text-decoration-none small text-primary fw-medium">Forgot Password?</a>
                    </div>
                    <div class="input-group">
                        <span class="input-group-text bg-light text-muted"><i class="bi bi-lock"></i></span>
                        <input type="password" id="password" name="password" class="form-control" placeholder="••••••••" required>
                    </div>
                </div>

                <!-- Remember Me Checkbox -->
                <div class="d-flex justify-content-between align-items-center mb-3">
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" name="remember-me" id="remember-me">
                        <label class="form-check-label small text-secondary" for="remember-me">
                            Remember me on this device
                        </label>
                    </div>
                </div>

                <button type="submit" id="submitBtn" class="btn btn-primary w-100 py-2 fw-semibold mb-3 shadow-sm">
                    <i class="bi bi-box-arrow-in-right me-1"></i> Sign In to Portal
                </button>
            </form>

            <!-- Quick Demo Credentials Box -->
            <div class="p-3 bg-light rounded-3 border">
                <div class="d-flex align-items-center justify-content-between mb-2">
                    <span class="small fw-bold text-secondary text-uppercase"><i class="bi bi-key-fill text-warning me-1"></i> Quick Demo Access</span>
                    <span class="badge bg-secondary-subtle text-secondary small">Click to test</span>
                </div>
                <div class="row g-2">
                    <div class="col-4">
                        <button type="button" class="btn btn-outline-primary btn-sm w-100 text-truncate" onclick="fillCreds('faculty', 'david.miller@college.edu', 'Faculty@123')">
                            <i class="bi bi-person-video3 me-1"></i> Faculty
                        </button>
                    </div>
                    <div class="col-4">
                        <button type="button" class="btn btn-outline-success btn-sm w-100 text-truncate" onclick="fillCreds('student', 'alex.morgan@student.edu', 'Student@123')">
                            <i class="bi bi-mortarboard me-1"></i> Student
                        </button>
                    </div>
                    <div class="col-4">
                        <button type="button" class="btn btn-outline-dark btn-sm w-100 text-truncate" onclick="fillCreds('admin', 'admin', 'Admin@123')">
                            <i class="bi bi-shield-lock me-1"></i> Admin
                        </button>
                    </div>
                </div>
            </div>

            <div class="text-center mt-3">
                <a th:href="@{/resend-verification}" class="text-decoration-none text-muted small">
                    <i class="bi bi-envelope-check me-1"></i> Resend Verification Email
                </a>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:inline="javascript">
/*<![CDATA[*/
var initialRole = /*[[${initialRole}]]*/ 'faculty';

function selectRole(role) {
    document.querySelectorAll('.role-pill-btn').forEach(b => b.classList.remove('active'));

    const usernameLabel = document.getElementById('usernameLabel');
    const usernameInput = document.getElementById('username');
    const usernameIcon = document.getElementById('usernameIcon');
    const usernameHelp = document.getElementById('usernameHelp');
    const portalTitle = document.getElementById('portalTitle');
    const portalSubtitle = document.getElementById('portalSubtitle');
    const portalIcon = document.getElementById('portalHeaderIcon');
    const submitBtn = document.getElementById('submitBtn');

    if (role === 'faculty') {
        document.getElementById('tabFaculty').classList.add('active');
        usernameLabel.textContent = 'Faculty ID or Email';
        usernameInput.placeholder = 'e.g. TCH101 or david.miller@college.edu';
        usernameIcon.className = 'bi bi-person-badge';
        usernameHelp.textContent = 'Enter your assigned Faculty ID or official college email.';
        portalTitle.textContent = 'Faculty Portal Login';
        portalSubtitle.textContent = 'Access faculty dashboard, student attendance, marks and timetable';
        portalIcon.className = 'bi bi-person-video3 fs-2 text-white';
        submitBtn.innerHTML = '<i class="bi bi-box-arrow-in-right me-1"></i> Sign In as Faculty';
    } else if (role === 'student') {
        document.getElementById('tabStudent').classList.add('active');
        usernameLabel.textContent = 'Student ID or Email';
        usernameInput.placeholder = 'e.g. STU1001 or alex.morgan@student.edu';
        usernameIcon.className = 'bi bi-mortarboard';
        usernameHelp.textContent = 'Enter your Student Roll ID or registered email address.';
        portalTitle.textContent = 'Student Portal Login';
        portalSubtitle.textContent = 'View your attendance, grades, results and fee records';
        portalIcon.className = 'bi bi-mortarboard-fill fs-2 text-white';
        submitBtn.innerHTML = '<i class="bi bi-box-arrow-in-right me-1"></i> Sign In as Student';
    } else if (role === 'admin') {
        document.getElementById('tabAdmin').classList.add('active');
        usernameLabel.textContent = 'Admin Username';
        usernameInput.placeholder = 'admin';
        usernameIcon.className = 'bi bi-shield-lock';
        usernameHelp.textContent = 'Enter your administrative credentials.';
        portalTitle.textContent = 'Administrator Portal Login';
        portalSubtitle.textContent = 'Full management access for academic operations and records';
        portalIcon.className = 'bi bi-shield-lock-fill fs-2 text-white';
        submitBtn.innerHTML = '<i class="bi bi-box-arrow-in-right me-1"></i> Sign In as Admin';
    }
}

function fillCreds(role, u, p) {
    selectRole(role);
    document.getElementById('username').value = u;
    document.getElementById('password').value = p;
}

window.addEventListener('DOMContentLoaded', () => {
    selectRole(initialRole || 'faculty');
});
/*]]>*/
</script>
</body>
</html>
