<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Access Denied - 403</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<div class="auth-wrapper">
    <div class="auth-card text-center p-4">
        <div class="my-4">
            <span class="display-1 fw-bold text-danger">403</span>
            <h4 class="fw-bold mt-2">Access Forbidden</h4>
            <p class="text-secondary small">You do not have permission to view or execute operations on this resource.</p>
        </div>

        <div class="d-grid gap-2 col-8 mx-auto">
            <a th:href="@{/}" class="btn btn-primary py-2 fw-semibold">
                <i class="bi bi-house-door-fill me-1"></i> Return to Homepage
            </a>
            <form th:action="@{/logout}" method="post">
                <button type="submit" class="btn btn-outline-secondary w-100 py-2">
                    <i class="bi bi-box-arrow-right me-1"></i> Logout
                </button>
            </form>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
