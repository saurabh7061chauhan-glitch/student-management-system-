<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/faculty-layout :: head(title='Faculty Notifications')}"></head>
<body>

<div class="app-wrapper">
    <aside th:replace="~{layout/faculty-layout :: sidebar(activeMenu='notifications', teacher=${teacher})}"></aside>

    <div class="main-content">
        <nav th:replace="~{layout/faculty-layout :: topbar(pageTitle='Notifications & Announcements', teacher=${teacher})}"></nav>

        <div class="page-container">
            <div class="card-custom">
                <div class="card-custom-header d-flex justify-content-between align-items-center">
                    <div class="fw-bold text-dark">
                        <i class="bi bi-bell-fill text-warning me-2"></i>Official University & Academic Bulletins
                    </div>
                    <span class="badge bg-primary-subtle text-primary" th:text="${#lists.size(notices) + ' Notices'}">4 Notices</span>
                </div>

                <div class="card-custom-body p-0">
                    <div class="list-group list-group-flush">
                        <div th:each="n : ${notices}" class="list-group-item p-4">
                            <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-2">
                                <div class="d-flex align-items-center gap-2">
                                    <span class="badge" 
                                          th:classappend="${n.priority == 'Urgent' ? 'bg-danger' : (n.priority == 'High' ? 'bg-warning text-dark' : 'bg-primary-subtle text-primary')}" 
                                          th:text="${n.priority}">Urgent</span>
                                    <span class="badge bg-light text-secondary border" th:text="${n.category}">Category</span>
                                    <span class="badge bg-light text-muted border">
                                        <i class="bi bi-people me-1"></i>Audience: <span th:text="${n.targetAudience}">FACULTY</span>
                                    </span>
                                </div>
                                <small class="text-muted">
                                    <i class="bi bi-calendar3 me-1"></i>Posted on: <strong th:text="${#temporals.format(n.postedDate, 'MMMM dd, yyyy')}">Oct 05, 2026</strong>
                                </small>
                            </div>

                            <h5 class="fw-bold text-dark mb-2" th:text="${n.title}">Notice Title</h5>
                            <p class="text-secondary mb-0 lh-base" th:text="${n.content}">
                                Notice detailed description and circular details.
                            </p>
                        </div>

                        <div th:if="${#lists.isEmpty(notices)}" class="p-5 text-center text-muted">
                            <i class="bi bi-bell-slash fs-1 d-block mb-2 text-muted"></i>
                            <h5>No Active Notifications</h5>
                            <p class="small text-muted mb-0">You are all caught up with official faculty announcements.</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<div th:replace="~{layout/faculty-layout :: scripts}"></div>
</body>
</html>
